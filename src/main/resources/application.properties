spring.application.name=taskmaster

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

security.jwt.issuer=taskmaster
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=3600

security.google.client-id=${GOOGLE_ID}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@taskmaster.local}

app.reminder.lead-one-hour=PT1H
app.reminder.lead-ten-minutes=PT10M
app.reminder.overdue-sweep-cron=0 */5 * * * *
